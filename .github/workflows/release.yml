name: Release prerelease artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Derive immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build>=1.2,<2"
      - name: Validate source metadata and generate notes
        run: >-
          python scripts/verify_release_artifacts.py
          --version "${{ env.RELEASE_VERSION }}"
          --notes-out "${{ runner.temp }}/RELEASE_NOTES.md"
      - name: Build twice and require byte-identical artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir "$RUNNER_TEMP/dist-one"
          python -m build --outdir "$RUNNER_TEMP/dist-two"
          python scripts/verify_release_artifacts.py \
            --version "$RELEASE_VERSION" \
            --dist "$RUNNER_TEMP/dist-one" \
            --compare "$RUNNER_TEMP/dist-two" \
            --checksums "$RUNNER_TEMP/dist-one/SHA256SUMS"
      - name: Install and smoke-test exact wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/dist-one/codex_smart_route-${RELEASE_VERSION}-py3-none-any.whl"
          smoke_venv="$RUNNER_TEMP/smoke-venv"
          for codex_path in "$HOME/.codex" "$HOME/.agents" "$HOME/.codex-smart-route"; do
            test ! -e "$codex_path"
          done
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --no-deps "$wheel"
          for codex_path in "$HOME/.codex" "$HOME/.agents" "$HOME/.codex-smart-route"; do
            test ! -e "$codex_path"
          done
          test "$("$smoke_venv/bin/smart-route" --version)" = "$RELEASE_VERSION"
          "$smoke_venv/bin/smart-route" route \
            --catalog examples/capabilities.example.json \
            --task "Release wheel smoke test" --dry-run --json
      - name: Stage release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-payload"
          cp "$RUNNER_TEMP/dist-one"/*.whl "$RUNNER_TEMP/release-payload/"
          cp "$RUNNER_TEMP/dist-one"/*.tar.gz "$RUNNER_TEMP/release-payload/"
          cp "$RUNNER_TEMP/dist-one/SHA256SUMS" "$RUNNER_TEMP/release-payload/"
          cp "$RUNNER_TEMP/RELEASE_NOTES.md" "$RUNNER_TEMP/release-payload/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-payload
          if-no-files-found: error
          retention-days: 7

  publish-github-prerelease:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: release-payload
      - name: Reverify downloaded payload
        working-directory: release-payload
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-payload/*.whl \
            release-payload/*.tar.gz \
            release-payload/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Codex Smart Route ${GITHUB_REF_NAME#v}" \
            --notes-file release-payload/RELEASE_NOTES.md
